name: Firebase Realtime Database Backup

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: firebase-realtime-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out backup script
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create streaming backup
        id: backup
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          node scripts/firebase-backup.js
          BACKUP_DIR=$(find . -maxdepth 1 -type d -name 'firebase-realtime-backup-*' -print -quit)
          test -n "$BACKUP_DIR"
          tar -czf firebase-realtime-backup.tar.gz -C "$(dirname "$BACKUP_DIR")" "$(basename "$BACKUP_DIR")"
          echo "file=firebase-realtime-backup.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Publish persistent backup file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=firebase-backup-latest
          FILE=${{ steps.backup.outputs.file }}

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Firebase Realtime Database Backup" \
              --notes "This release contains the latest automated Firebase backup." \
              --prerelease
          fi

          gh release upload "$TAG" "$FILE" --clobber

      - name: Output download link
        run: |
          {
            echo "### Firebase Backup Ready"
            echo
            echo "Download the persistent backup from: https://github.com/${{ github.repository }}/releases/tag/firebase-backup-latest"
          } >> "$GITHUB_STEP_SUMMARY"
